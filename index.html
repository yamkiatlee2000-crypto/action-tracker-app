<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Track actions agreed in meetings by owner, with due dates, done ticks and overdue alerts.">
<meta name="theme-color" content="#EDEFF1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14171A" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
/* Base reset (safe-area padding for phones with notches) */
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>Meeting Action Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&display=swap">
<style>
/* Layout: one narrow column — header, three tally tiles, the add card, then owner cards in a wrapping grid. */
:root {
  --bg: #EDEFF1;
  --surface: #FFFFFF;
  --surface-2: #F5F6F7;
  --ink: #1E2327;
  --ink-2: #565E66;
  --ink-3: #868E96;
  --line: #DCE0E4;
  --line-strong: #B6BDC4;
  --accent: #6B47C9;
  --accent-ink: #5536A8;
  --accent-soft: #ECE6FA;
  --rainbow: linear-gradient(90deg, #D93A3A, #E2761B, #C99A00, #2E9E5B, #2F6FD0, #6B47C9);
  --cat-alpha: 0.2;
  --on-accent: #FFFFFF;
  --ok: #2E9E5B;
  --red: #D4261A;
  --red-ink: #B01E14;
  --red-soft: #FDE7E3;
  --shadow: 0 1px 2px rgba(30, 35, 39, .05), 0 4px 14px rgba(30, 35, 39, .05);

  --font-display: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", "Segoe UI", system-ui, -apple-system, sans-serif;

  --r-card: 18px;
  --r-ctl: 12px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14171A; --surface: #1D2125; --surface-2: #24292E; --ink: #E7EAED; --ink-2: #A3ABB3; --ink-3: #78818A;
    --line: #2F353B; --line-strong: #48505A; --accent: #9C82F0; --accent-ink: #B9A6F7; --accent-soft: #2A2340;
    --rainbow: linear-gradient(90deg, #F2645E, #F59140, #E6C040, #4CC383, #5A96EA, #9C82F0); --cat-alpha: 0.24;
    --on-accent: #FFFFFF; --ok: #4CC383; --red: #FF6A5C; --red-ink: #FFA59B; --red-soft: #431B1A; --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14171A; --surface: #1D2125; --surface-2: #24292E; --ink: #E7EAED; --ink-2: #A3ABB3; --ink-3: #78818A;
  --line: #2F353B; --line-strong: #48505A; --accent: #9C82F0; --accent-ink: #B9A6F7; --accent-soft: #2A2340;
    --rainbow: linear-gradient(90deg, #F2645E, #F59140, #E6C040, #4CC383, #5A96EA, #9C82F0); --cat-alpha: 0.24;
  --on-accent: #FFFFFF; --ok: #4CC383; --red: #FF6A5C; --red-ink: #FFA59B; --red-soft: #431B1A; --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 1.125rem;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}
.wrap {
  max-width: 1080px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 40px 96px;
  display: flex;
  flex-direction: column;
  gap: 28px;
}
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.01em; }
button, input { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.top h1 { font-size: clamp(2rem, 5vw, 2.75rem); font-weight: 700; line-height: 1.05; }
.top p { margin: 8px 0 0; color: var(--ink-2); font-size: 1.125rem; }
.today { color: var(--ink-2); font-size: 1rem; }
.today strong { color: var(--ink); font-weight: 700; }

/* Tallies */
.tallies { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.tally {
  background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: 18px 20px; display: flex; flex-direction: column; gap: 2px; min-width: 0;
}
.tally .n { font-family: var(--font-display); font-size: clamp(2rem, 6vw, 2.75rem); font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.tally .l { font-size: .8125rem; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-2); font-weight: 700; }
.tally.overdue.has .n { color: var(--red); }
.tally.overdue.has { background: var(--red-soft); box-shadow: none; }
.tally.overdue.has .l { color: var(--red-ink); }
.tally .sub { font-size: .9375rem; color: var(--ink-3); }

/* Add form */
.add {
  background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow);
  padding: 22px; display: grid; gap: 16px;
  grid-template-columns: minmax(0, 1fr) minmax(0, 220px) minmax(0, 190px) auto;
  align-items: end;
}
.add h2 { grid-column: 1 / -1; font-size: 1.25rem; font-weight: 600; }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field label { font-size: .9375rem; font-weight: 700; color: var(--ink-2); }
.field input {
  width: 100%; height: 52px; padding: 0 14px; font-size: 1.125rem;
  background: var(--surface-2); border: 1.5px solid var(--line); border-radius: var(--r-ctl);
}
.field input:focus { border-color: var(--accent); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
.field input::placeholder { color: var(--ink-3); }
.btn-primary {
  height: 52px; padding: 0 24px; border: 0; border-radius: var(--r-ctl);
  background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 1.125rem; cursor: pointer;
  white-space: nowrap;
}
.btn-primary:hover { filter: brightness(1.06); }
.form-error { grid-column: 1 / -1; margin: -4px 0 0; color: var(--red-ink); font-size: 1rem; }

@media (max-width: 860px) {
  .add { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
  .add .f-text { grid-column: 1 / -1; }
  .add .btn-primary { grid-column: 1 / -1; }
}
@media (max-width: 480px) {
  .add { grid-template-columns: minmax(0, 1fr); padding: 18px; }
  .tally { padding: 14px; }
  .tally .sub { display: none; }
}

/* Toolbar */
.bar { display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px 20px; }
.bar h2 { font-size: 1.5rem; font-weight: 700; }
.bar-right { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 16px; }
.toggle {
  display: inline-flex; align-items: center; gap: 10px; background: none; border: 0; padding: 6px 0; cursor: pointer;
  color: var(--ink-2); font-size: 1rem;
}
.toggle .track { width: 44px; height: 26px; border-radius: 99px; background: var(--line-strong); position: relative; transition: background .15s; }
.toggle .track::after { content: ""; position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--surface); transition: transform .15s; }
.toggle[aria-pressed="true"] .track { background: var(--accent); }
.toggle[aria-pressed="true"] .track::after { transform: translateX(18px); }
.sample-note {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px;
  background: var(--accent-soft); color: var(--ink); border-radius: var(--r-ctl); padding: 10px 14px; font-size: 1rem;
}
.link-btn { background: none; border: 0; padding: 0; color: var(--accent-ink); font-weight: 700; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 1rem; }

/* Owner cards */
.owners { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 340px), 1fr)); gap: 16px; align-items: start; }
.owner { background: var(--surface); border-radius: var(--r-card); box-shadow: var(--shadow); overflow: hidden; min-width: 0; }
.owner-head { padding: 18px 20px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 4px 14px; align-items: center; }
.avatar {
  grid-row: span 2; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center;
  background: var(--surface-2); color: var(--ink-2); font-family: var(--font-display); font-weight: 700; font-size: 1.0625rem;
  border: 1.5px solid var(--line);
}
.owner-head h3 { font-size: 1.3125rem; font-weight: 700; overflow-wrap: anywhere; }
.owner-meta { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; color: var(--ink-2); font-size: .9375rem; }
.pill-red { background: var(--red); color: #fff; border-radius: 99px; padding: 1px 10px; font-weight: 700; font-size: .875rem; }
:root[data-theme="dark"] .pill-red { color: #1A0B0A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill-red { color: #1A0B0A; } }
.progress { height: 4px; background: var(--surface-2); }
.progress span { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.items { list-style: none; margin: 0; padding: 6px 0; }
.item {
  display: grid; grid-template-columns: 28px minmax(0, 1fr) 36px; gap: 14px; align-items: start;
  padding: 14px 14px 14px 20px; border-top: 1px solid var(--line);
}
.item:first-child { border-top: 0; }
.item.is-overdue { background: var(--red-soft); border-top-color: transparent; }
.item.is-overdue + .item { border-top-color: transparent; }
.item input[type="checkbox"] {
  appearance: none; -webkit-appearance: none; margin: 2px 0 0; width: 28px; height: 28px; cursor: pointer;
  border: 2px solid var(--line-strong); border-radius: 8px; background: var(--surface); display: grid; place-content: center;
  transition: background .12s, border-color .12s;
}
.item input[type="checkbox"]::before {
  content: ""; width: 14px; height: 14px; background: var(--on-accent);
  clip-path: polygon(14% 52%, 0 66%, 38% 100%, 100% 22%, 86% 8%, 38% 72%); transform: scale(0); transition: transform .12s;
}
.item input[type="checkbox"]:checked { background: var(--accent); border-color: var(--accent); }
.item input[type="checkbox"]:checked::before { transform: scale(1); }
.item.is-overdue input[type="checkbox"] { border-color: var(--red); }
.item-body { min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.item-text { font-size: 1.125rem; line-height: 1.4; overflow-wrap: anywhere; cursor: pointer; }
.item.is-overdue .item-text { color: var(--red-ink); font-weight: 700; }
.due { font-size: .9375rem; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
.due .tag { border-radius: 99px; padding: 1px 10px; font-weight: 700; font-size: .875rem; }
.due .tag.over { background: var(--red); color: #fff; }
:root[data-theme="dark"] .due .tag.over { color: #1A0B0A; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .due .tag.over { color: #1A0B0A; } }
.due .tag.today { background: var(--accent-soft); color: var(--accent-ink); }
.item.is-overdue .due { color: var(--red-ink); }
.item.is-done .item-text { color: var(--ink-3); text-decoration: line-through; text-decoration-thickness: 1.5px; }
.item.is-done .due { color: var(--ink-3); }
.del {
  width: 36px; height: 36px; border: 0; border-radius: 10px; background: none; color: var(--ink-3);
  font-size: 1.375rem; line-height: 1; cursor: pointer; display: grid; place-items: center;
}
.del:hover { background: var(--surface-2); color: var(--ink); }
.hidden-done { padding: 10px 20px 16px; color: var(--ink-3); font-size: .9375rem; }

.empty {
  grid-column: 1 / -1; background: var(--surface); border: 2px dashed var(--line); border-radius: var(--r-card);
  padding: 36px 24px; text-align: center; color: var(--ink-2);
}
.empty strong { display: block; color: var(--ink); font-family: var(--font-display); font-size: 1.375rem; margin-bottom: 6px; }

.today { display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
@media (max-width: 600px) { .today { align-items: flex-start; } }
.sync { display: inline-flex; align-items: center; gap: 8px; font-size: .9375rem; color: var(--ink-2); background: var(--surface); border-radius: 99px; padding: 3px 12px 3px 10px; box-shadow: var(--shadow); }
.sync .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ink-3); }
.sync.live .dot { background: var(--ok); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ok) 25%, transparent); }
.sync.ok .dot { background: var(--ok); }
.sync.err { color: var(--red-ink); }
.sync.err .dot { background: var(--red); }
.import-note {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px;
  background: var(--accent-soft); border-radius: var(--r-ctl); padding: 12px 16px; font-size: 1rem;
}
.import-actions { display: flex; flex-wrap: wrap; gap: 8px 18px; }
.link-btn.muted { color: var(--ink-2); font-weight: 400; }
.link-btn:disabled { opacity: .6; cursor: default; }
.due .tag.doing { background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); }
.empty .retry { margin-top: 12px; display: inline-block; }

/* Toast */
.toast {
  position: fixed; left: 50%; transform: translateX(-50%);
  bottom: calc(20px + env(safe-area-inset-bottom, 0px));
  max-width: calc(100% - 32px); display: flex; align-items: center; gap: 16px;
  background: var(--ink); color: var(--bg); border-radius: 14px; padding: 12px 18px; font-size: 1rem;
  box-shadow: 0 8px 28px rgba(0,0,0,.2);
}
.toast button { background: none; border: 0; color: var(--accent); font-weight: 700; cursor: pointer; padding: 4px; font-size: 1rem; }
:root[data-theme="dark"] .toast button { color: var(--accent-ink); }

/* Rainbow accent */
.top h1 { background: var(--rainbow); -webkit-background-clip: text; background-clip: text; color: transparent; padding-bottom: .06em; }
.btn-primary { background: var(--rainbow); color: #FFFFFF; text-shadow: 0 1px 2px rgba(0,0,0,.35); }
.progress span { background: var(--rainbow); }
.item input[type="checkbox"]:checked { background: var(--rainbow); border-color: transparent; }
.item input[type="checkbox"]::before { background: #FFFFFF; }
.toggle[aria-pressed="true"] .track { background: var(--rainbow); }
.owner { position: relative; }
.owner::before { content: ""; position: absolute; inset: 0 0 auto; height: 3px; background: var(--rainbow); opacity: .85; }

/* Cats walking behind the page */
#cats { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; }
.wrap { position: relative; z-index: 1; }
.toast { z-index: 2; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<canvas id="cats" aria-hidden="true"></canvas>
<main class="wrap">
  <header class="top">
    <div>
      <h1>Meeting actions</h1>
      <p>Everything agreed in the room, with a name and a date on it.</p>
    </div>
    <div class="today"><span>Today is <strong id="today-date"></strong></span><span class="sync" id="sync" role="status"><span class="dot" aria-hidden="true"></span><span>Connecting…</span></span></div>
  </header>

  <section class="tallies" aria-label="Summary">
    <div class="tally"><span class="l">Open</span><span class="n" id="n-open">0</span><span class="sub" id="s-open">&nbsp;</span></div>
    <div class="tally overdue" id="t-overdue"><span class="l">Overdue</span><span class="n" id="n-overdue">0</span><span class="sub" id="s-overdue">&nbsp;</span></div>
    <div class="tally"><span class="l">Done</span><span class="n" id="n-done">0</span><span class="sub" id="s-done">&nbsp;</span></div>
  </section>

  <form class="add" id="add-form" novalidate>
    <h2>Add an action</h2>
    <div class="field f-text">
      <label for="f-text">What was agreed</label>
      <input id="f-text" type="text" autocomplete="off" placeholder="e.g. Send the revised proposal to the client">
    </div>
    <div class="field">
      <label for="f-owner">Owner</label>
      <input id="f-owner" type="text" list="owner-list" autocomplete="off" placeholder="Who's doing it">
      <datalist id="owner-list"></datalist>
    </div>
    <div class="field">
      <label for="f-due">Due date</label>
      <input id="f-due" type="date">
    </div>
    <button class="btn-primary" type="submit">Add action</button>
    <p class="form-error" id="form-error" hidden></p>
  </form>

  <div class="bar">
    <h2>By owner</h2>
    <div class="bar-right">
      <div class="sample-note" id="sample-note" hidden>
        <span>Includes example actions.</span>
        <button class="link-btn" type="button" id="clear-samples">Remove examples</button>
      </div>
      <button class="toggle" type="button" id="toggle-done" aria-pressed="false">
        <span class="track" aria-hidden="true"></span><span>Hide done</span>
      </button>
    </div>
  </div>
  <div class="import-note" id="import-note" hidden>
    <span id="import-count"></span>
    <span class="import-actions"><button class="link-btn" type="button" id="import-btn">Upload them</button><button class="link-btn muted" type="button" id="import-dismiss">Not now</button></span>
  </div>

  <section class="owners" id="owners" aria-live="polite"></section>
</main>

<div class="toast" id="toast" role="status" hidden><span id="toast-msg"></span><button type="button" id="toast-undo">Undo</button></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
(function () {
  // ---- Supabase connection ----
  // The publishable key is meant to be public; access is governed by the table's row-level security policies.
  var SUPABASE_URL = 'https://ycmvggjeajjrrslmzuwh.supabase.co';
  var SUPABASE_KEY = 'sb_publishable_wELm3YjpWzPYavKGZl66iQ_1NAy824r';
  var TABLE = 'tasks';

  var LEGACY_KEY = 'meeting-action-tracker-v1';        // data saved by the browser-only version
  var PREFS_KEY = 'meeting-action-tracker-prefs';
  var IMPORT_DONE_KEY = 'meeting-action-tracker-imported';

  function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function lsSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }

  var db = (window.supabase && window.supabase.createClient)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY)
    : null;

  var rows = [];          // raw rows from public.tasks
  var loaded = false;
  var loadError = null;
  var prefs = { hideDone: false };
  try { Object.assign(prefs, JSON.parse(lsGet(PREFS_KEY) || '{}')); } catch (e) {}
  try { var legacy = JSON.parse(lsGet(LEGACY_KEY) || 'null'); if (legacy && legacy.hideDone && lsGet(PREFS_KEY) == null) prefs.hideDone = true; } catch (e) {}
  function savePrefs() { lsSet(PREFS_KEY, JSON.stringify(prefs)); }

  // ---- Date helpers ----
  function pad(n) { return String(n).padStart(2, '0'); }
  function iso(d) { return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); }
  function todayIso() { return iso(new Date()); }
  function addDays(n) { var d = new Date(); d.setHours(12, 0, 0, 0); d.setDate(d.getDate() + n); return iso(d); }
  function parse(s) { var p = s.split('-').map(Number); return new Date(p[0], p[1] - 1, p[2], 12); }
  function daysFromToday(s) { return s ? Math.round((parse(s) - parse(todayIso())) / 86400000) : null; }
  function fmt(s) { return parse(s).toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' }); }
  function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
  function nowIso() { return new Date().toISOString(); }

  // ---- Row <-> action ----
  function toAction(r) {
    var owner = (r.owner || '').trim();
    return {
      id: r.id,
      text: r.title || '(untitled)',
      owner: owner || 'Unassigned',
      unassigned: !owner,
      due: r.deadline || null,
      done: r.status === 'done',
      doing: r.status === 'doing',
      doneAt: r.done_at ? Date.parse(r.done_at) : null,
      sample: !!r.is_example
    };
  }
  function findRow(id) { for (var i = 0; i < rows.length; i++) if (rows[i].id === id) return i; return -1; }
  function putRow(r) { var i = findRow(r.id); if (i === -1) rows.push(r); else rows[i] = Object.assign({}, rows[i], r); }
  function dropRow(id) { rows = rows.filter(function (r) { return r.id !== id; }); }
  function clone(r) { return JSON.parse(JSON.stringify(r)); }

  // ---- Connection status ----
  var statusEl = document.getElementById('sync');
  function setStatus(kind, text) {
    statusEl.className = 'sync ' + kind;
    statusEl.lastChild.textContent = text;
  }

  // ---- Toast (undo + errors) ----
  var toast = document.getElementById('toast');
  var toastUndo = document.getElementById('toast-undo');
  var undoFn = null, toastTimer = null;
  function showToast(msg, onUndo) {
    undoFn = onUndo || null;
    document.getElementById('toast-msg').textContent = msg;
    toastUndo.hidden = !undoFn;
    toast.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { toast.hidden = true; undoFn = null; }, onUndo ? 6000 : 5000);
  }
  toastUndo.addEventListener('click', function () {
    var fn = undoFn; undoFn = null; toast.hidden = true;
    if (fn) fn();
  });
  function failed(what, err) {
    console.error(what, err);
    showToast(what + ' didn’t save. Check your connection and try again.');
    setStatus('err', 'Not saved');
  }

  // ---- Data access ----
  function load() {
    if (!db) { loadError = 'The database library didn’t load. Check your connection and reload the page.'; render(); setStatus('err', 'Offline'); return Promise.resolve(); }
    return db.from(TABLE).select('*').order('created_at', { ascending: true }).then(function (res) {
      if (res.error) throw res.error;
      rows = res.data || [];
      loaded = true; loadError = null;
      render();
      if (statusEl.className.indexOf('live') === -1) setStatus('ok', 'Synced');
    }).catch(function (err) {
      console.error('Load failed', err);
      if (!loaded) loadError = 'Couldn’t load actions from the database. Check your connection, then try again.';
      setStatus('err', 'Offline');
      render();
    });
  }

  function subscribe() {
    if (!db || !db.channel) return;
    db.channel('meeting-actions-live')
      .on('postgres_changes', { event: '*', schema: 'public', table: TABLE }, function (p) {
        if (p.eventType === 'DELETE') { if (p.old && p.old.id) dropRow(p.old.id); }
        else if (p.new && p.new.id) { putRow(p.new); }
        render();
      })
      .subscribe(function (state) {
        if (state === 'SUBSCRIBED') { setStatus('live', 'Live'); load(); }
        else if (state === 'CHANNEL_ERROR' || state === 'TIMED_OUT') { setStatus('ok', 'Synced'); }
      });
  }

  function addAction(text, owner, due) {
    var row = { id: 'ma-' + uid(), title: text, owner: owner, deadline: due, status: 'todo', created_at: nowIso(), last_update: nowIso() };
    putRow(row); render();
    return db.from(TABLE).insert(row).select().single().then(function (res) {
      if (res.error) throw res.error;
      putRow(res.data); render();
    }).catch(function (err) { dropRow(row.id); render(); failed('That action', err); });
  }

  function setDone(id, done) {
    var i = findRow(id); if (i === -1) return;
    var before = clone(rows[i]);
    var patch = done
      ? { status: 'done', done_at: nowIso(), last_update: nowIso() }
      : { status: 'todo', done_at: null, last_update: nowIso() };
    putRow(Object.assign({ id: id }, patch)); render();
    db.from(TABLE).update(patch).eq('id', id).then(function (res) {
      if (res.error) throw res.error;
    }).catch(function (err) { putRow(before); render(); failed('That change', err); });
  }

  function restore(list, label) {
    list.forEach(putRow); render();
    db.from(TABLE).upsert(list).then(function (res) {
      if (res.error) throw res.error;
      showToast(label);
    }).catch(function (err) { list.forEach(function (r) { dropRow(r.id); }); render(); failed('Undo', err); });
  }

  function deleteAction(id) {
    var i = findRow(id); if (i === -1) return;
    var snap = clone(rows[i]);
    dropRow(id); render();
    db.from(TABLE).delete().eq('id', id).then(function (res) {
      if (res.error) throw res.error;
      showToast('Action deleted', function () { restore([snap], 'Action restored'); });
    }).catch(function (err) { putRow(snap); render(); failed('Delete', err); });
  }

  function removeExamples() {
    var snaps = rows.filter(function (r) { return r.is_example; }).map(clone);
    if (!snaps.length) return;
    snaps.forEach(function (r) { dropRow(r.id); }); render();
    db.from(TABLE).delete().eq('is_example', true).then(function (res) {
      if (res.error) throw res.error;
      showToast(plural(snaps.length, 'example') + ' removed', function () { restore(snaps, 'Examples restored'); });
    }).catch(function (err) { snaps.forEach(putRow); render(); failed('Removing examples', err); });
  }

  // ---- One-time import of actions saved by the browser-only version ----
  function legacyActions() {
    if (lsGet(IMPORT_DONE_KEY)) return [];
    try {
      var s = JSON.parse(lsGet(LEGACY_KEY) || 'null');
      if (!s || !Array.isArray(s.actions)) return [];
      return s.actions.filter(function (a) { return a && !a.sample && a.text && a.owner && a.due; });
    } catch (e) { return []; }
  }
  function importLegacy() {
    var list = legacyActions();
    if (!list.length) return;
    var btn = document.getElementById('import-btn');
    btn.disabled = true; btn.textContent = 'Uploading…';
    var payload = list.map(function (a) {
      return {
        id: 'ma-local-' + a.id,
        title: a.text,
        owner: a.owner.trim(),
        deadline: a.due,
        status: a.done ? 'done' : 'todo',
        done_at: a.done ? new Date(a.doneAt || Date.now()).toISOString() : null,
        created_at: new Date(a.createdAt || Date.now()).toISOString(),
        last_update: nowIso()
      };
    });
    db.from(TABLE).upsert(payload, { onConflict: 'id', ignoreDuplicates: true }).then(function (res) {
      if (res.error) throw res.error;
      lsSet(IMPORT_DONE_KEY, nowIso());
      showToast(plural(payload.length, 'action') + ' uploaded to the shared list');
      return load();
    }).catch(function (err) {
      btn.disabled = false; btn.textContent = 'Upload them';
      failed('The upload', err);
    }).then(render);
  }
  document.getElementById('import-btn').addEventListener('click', importLegacy);
  document.getElementById('import-dismiss').addEventListener('click', function () { lsSet(IMPORT_DONE_KEY, 'dismissed'); render(); });

  // ---- Rendering helpers ----
  function isOverdue(a) { return !a.done && a.due != null && daysFromToday(a.due) < 0; }
  function initials(name) {
    var parts = name.trim().split(/\s+/);
    return ((parts[0] || '')[0] || '').toUpperCase() + ((parts[1] || '')[0] || '').toUpperCase();
  }
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }

  function dueLine(a) {
    var wrap = el('div', 'due');
    if (a.done) {
      wrap.appendChild(el('span', null, 'Done' + (a.due ? ' · was due ' + fmt(a.due) : '')));
      return wrap;
    }
    if (a.doing) wrap.appendChild(el('span', 'tag doing', 'In progress'));
    if (!a.due) { wrap.appendChild(el('span', null, 'No due date')); return wrap; }
    var d = daysFromToday(a.due);
    if (d < 0) {
      wrap.appendChild(el('span', 'tag over', 'Overdue ' + plural(-d, 'day')));
      wrap.appendChild(el('span', null, 'was due ' + fmt(a.due)));
    } else if (d === 0) {
      wrap.appendChild(el('span', 'tag today', 'Due today'));
    } else if (d === 1) {
      wrap.appendChild(el('span', null, 'Due tomorrow · ' + fmt(a.due)));
    } else {
      wrap.appendChild(el('span', null, 'Due ' + fmt(a.due) + ' · in ' + d + ' days'));
    }
    return wrap;
  }

  function messageCard(title, body, actionLabel, onAction) {
    var e = el('div', 'empty');
    e.appendChild(el('strong', null, title));
    e.appendChild(el('span', null, body));
    if (actionLabel) {
      var b = el('button', 'link-btn retry', actionLabel); b.type = 'button';
      b.addEventListener('click', onAction);
      e.appendChild(b);
    }
    return e;
  }

  // ---- Render ----
  function render() {
    var acts = rows.map(toAction);
    var open = acts.filter(function (a) { return !a.done; });
    var done = acts.filter(function (a) { return a.done; });
    var overdue = open.filter(isOverdue);
    var dueToday = open.filter(function (a) { return a.due && daysFromToday(a.due) === 0; });

    document.getElementById('n-open').textContent = loaded ? open.length : '–';
    document.getElementById('n-overdue').textContent = loaded ? overdue.length : '–';
    document.getElementById('n-done').textContent = loaded ? done.length : '–';
    document.getElementById('s-open').textContent = !loaded ? ' ' : dueToday.length ? dueToday.length + ' due today' : (open.length ? 'none due today' : 'all clear');
    document.getElementById('s-overdue').textContent = !loaded ? ' ' : overdue.length ? 'needs chasing' : 'nothing late';
    document.getElementById('s-done').textContent = (loaded && acts.length) ? Math.round(done.length / acts.length * 100) + '% of all actions' : ' ';
    document.getElementById('t-overdue').classList.toggle('has', overdue.length > 0);

    document.getElementById('sample-note').hidden = !acts.some(function (a) { return a.sample; });
    var pending = loaded ? legacyActions().length : 0;
    document.getElementById('import-note').hidden = !pending;
    if (pending) document.getElementById('import-count').textContent = 'You have ' + plural(pending, 'action') + ' saved only in this browser.';
    document.getElementById('toggle-done').setAttribute('aria-pressed', prefs.hideDone ? 'true' : 'false');

    // Group by owner (case-insensitive)
    var groups = {};
    acts.forEach(function (a) {
      var k = a.unassigned ? '\u0000unassigned' : a.owner.toLowerCase();
      if (!groups[k]) groups[k] = { name: a.owner, unassigned: a.unassigned, items: [] };
      groups[k].items.push(a);
    });
    var list = Object.keys(groups).map(function (k) { return groups[k]; });
    list.forEach(function (g) {
      g.open = g.items.filter(function (a) { return !a.done; }).length;
      g.overdue = g.items.filter(isOverdue).length;
      g.items.sort(function (x, y) {
        if (x.done !== y.done) return x.done ? 1 : -1;
        if (!x.done) {
          if (x.due === y.due) return 0;
          if (!x.due) return 1;
          if (!y.due) return -1;
          return x.due < y.due ? -1 : 1;
        }
        return (y.doneAt || 0) - (x.doneAt || 0);
      });
    });
    list.sort(function (a, b) {
      if (a.unassigned !== b.unassigned) return a.unassigned ? 1 : -1;
      return b.overdue - a.overdue || b.open - a.open || a.name.localeCompare(b.name);
    });

    var dl = document.getElementById('owner-list');
    dl.innerHTML = '';
    list.forEach(function (g) { if (!g.unassigned) { var o = document.createElement('option'); o.value = g.name; dl.appendChild(o); } });

    var root = document.getElementById('owners');
    root.innerHTML = '';
    if (!loaded) {
      root.appendChild(loadError
        ? messageCard('Can’t reach the database', loadError, 'Try again', function () { loadError = null; render(); load(); })
        : messageCard('Loading actions…', 'Fetching the shared list.'));
      return;
    }
    if (!acts.length) {
      root.appendChild(messageCard('No actions yet', 'Add the first one above. Each owner gets their own card.'));
      return;
    }

    list.forEach(function (g) {
      var card = el('article', 'owner');
      var head = el('div', 'owner-head');
      var av = el('div', 'avatar', g.unassigned ? '?' : initials(g.name)); av.setAttribute('aria-hidden', 'true');
      head.appendChild(av);
      head.appendChild(el('h3', null, g.name));
      var meta = el('div', 'owner-meta');
      var doneCount = g.items.length - g.open;
      meta.appendChild(el('span', null, g.open + ' open · ' + doneCount + ' done'));
      if (g.overdue) meta.appendChild(el('span', 'pill-red', g.overdue + ' overdue'));
      head.appendChild(meta);
      card.appendChild(head);

      var prog = el('div', 'progress');
      prog.setAttribute('role', 'img');
      prog.setAttribute('aria-label', doneCount + ' of ' + g.items.length + ' done');
      var bar = el('span'); bar.style.width = (g.items.length ? doneCount / g.items.length * 100 : 0) + '%';
      prog.appendChild(bar);
      card.appendChild(prog);

      var ul = el('ul', 'items');
      var hiddenCount = 0;
      g.items.forEach(function (a) {
        if (prefs.hideDone && a.done) { hiddenCount++; return; }
        var li = el('li', 'item' + (a.done ? ' is-done' : '') + (isOverdue(a) ? ' is-overdue' : ''));
        var cb = document.createElement('input');
        cb.type = 'checkbox'; cb.id = 'chk-' + a.id; cb.checked = a.done;
        cb.addEventListener('change', function () { setDone(a.id, cb.checked); });
        var body = el('div', 'item-body');
        var lab = el('label', 'item-text', a.text); lab.htmlFor = cb.id;
        body.appendChild(lab);
        body.appendChild(dueLine(a));
        var del = el('button', 'del', '×');
        del.type = 'button';
        del.setAttribute('aria-label', 'Delete action: ' + a.text);
        del.title = 'Delete';
        del.addEventListener('click', function () { deleteAction(a.id); });
        li.appendChild(cb); li.appendChild(body); li.appendChild(del);
        ul.appendChild(li);
      });
      if (ul.children.length) card.appendChild(ul);
      if (hiddenCount) card.appendChild(el('div', 'hidden-done', plural(hiddenCount, 'done action') + ' hidden'));
      root.appendChild(card);
    });
  }

  // ---- Form ----
  var form = document.getElementById('add-form');
  var fText = document.getElementById('f-text');
  var fOwner = document.getElementById('f-owner');
  var fDue = document.getElementById('f-due');
  var fErr = document.getElementById('form-error');
  fDue.value = addDays(7);

  form.addEventListener('submit', function (ev) {
    ev.preventDefault();
    var text = fText.value.trim(), owner = fOwner.value.trim(), due = fDue.value;
    var missing = [];
    if (!text) missing.push('what was agreed');
    if (!owner) missing.push('an owner');
    if (!due) missing.push('a due date');
    if (missing.length) {
      fErr.textContent = 'Add ' + missing.join(', ').replace(/, ([^,]*)$/, ' and $1') + ' to save this action.';
      fErr.hidden = false;
      (!text ? fText : !owner ? fOwner : fDue).focus();
      return;
    }
    if (!loaded) {
      fErr.textContent = 'The shared list hasn’t loaded yet, so this can’t be saved. Try again in a moment.';
      fErr.hidden = false;
      return;
    }
    var match = rows.find(function (r) { return (r.owner || '').trim().toLowerCase() === owner.toLowerCase(); });
    if (match) owner = match.owner.trim();
    fErr.hidden = true;
    addAction(text, owner, due);
    fText.value = '';
    fText.focus();
  });

  document.getElementById('toggle-done').addEventListener('click', function () {
    prefs.hideDone = !prefs.hideDone; savePrefs(); render();
  });
  document.getElementById('clear-samples').addEventListener('click', removeExamples);

  var t = new Date();
  var td = document.getElementById('today-date');
  td.textContent = t.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

  // Refresh when the tab comes back (catches anything missed while asleep) and every 2 minutes as a backstop.
  document.addEventListener('visibilitychange', function () { if (!document.hidden) { render(); load(); } });
  setInterval(function () { if (!document.hidden) load(); }, 120000);

  render();
  load().then(subscribe);
})();
</script>
<script>
(function () {
  var canvas = document.getElementById('cats');
  if (!canvas || !canvas.getContext) return;
  var ctx = canvas.getContext('2d');
  var hues = ['#D93A3A', '#E2761B', '#C99A00', '#2E9E5B', '#2F6FD0', '#6B47C9'];
  var reduce = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W = 0, H = 0, dpr = 1, cats = [], alpha = 0.2, bg = '#EDEFF1', frame = 0, last = 0;

  function readTheme() {
    var cs = getComputedStyle(document.documentElement);
    alpha = parseFloat(cs.getPropertyValue('--cat-alpha')) || 0.2;
    bg = cs.getPropertyValue('--bg').trim() || bg;
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  function rand(a, b) { return a + Math.random() * (b - a); }
  function spawn(c, initial) {
    c.s = rand(0.7, 1.35);
    c.dir = Math.random() < 0.5 ? 1 : -1;
    c.speed = rand(22, 48) * (0.8 + c.s * 0.3);
    c.y = rand(90, Math.max(140, H - 20));
    c.x = initial ? rand(0, W) : (c.dir > 0 ? -90 * c.s : W + 90 * c.s);
    c.phase = rand(0, 6.28);
    c.tail = rand(0, 6.28);
    return c;
  }
  function makeCats() {
    var n = Math.max(4, Math.min(9, Math.round(W * H / 150000)));
    cats = [];
    for (var i = 0; i < n; i++) { var c = spawn({}, true); c.color = hues[i % hues.length]; cats.push(c); }
  }

  function leg(x, swing) {
    ctx.beginPath();
    ctx.moveTo(x, -16);
    ctx.lineTo(x + Math.sin(swing) * 7, 0);
    ctx.stroke();
  }
  function drawCat(c) {
    var bob = Math.abs(Math.sin(c.phase)) * 1.6;
    ctx.save();
    ctx.translate(c.x, c.y);
    ctx.scale(c.s * c.dir, c.s);
    ctx.globalAlpha = alpha;
    ctx.fillStyle = c.color; ctx.strokeStyle = c.color;
    ctx.lineCap = 'round'; ctx.lineJoin = 'round';

    // legs
    ctx.lineWidth = 5;
    leg(17, c.phase); leg(-15, c.phase + Math.PI);
    ctx.globalAlpha = alpha * 0.7;
    leg(12, c.phase + Math.PI); leg(-20, c.phase);
    ctx.globalAlpha = alpha;

    ctx.translate(0, -bob);
    // tail
    var t = Math.sin(c.tail) * 6;
    ctx.lineWidth = 5;
    ctx.beginPath();
    ctx.moveTo(-24, -24);
    ctx.quadraticCurveTo(-44, -28 + t * 0.5, -42 + t * 0.6, -50 + t);
    ctx.stroke();
    // body
    ctx.beginPath(); ctx.ellipse(0, -23, 27, 12, 0, 0, Math.PI * 2); ctx.fill();
    // head
    ctx.beginPath(); ctx.arc(28, -35, 11, 0, Math.PI * 2); ctx.fill();
    // ears
    ctx.beginPath();
    ctx.moveTo(19, -40); ctx.lineTo(21, -55); ctx.lineTo(28, -45);
    ctx.moveTo(28, -45); ctx.lineTo(35, -55); ctx.lineTo(38, -39);
    ctx.fill();
    // eye
    ctx.globalAlpha = Math.min(1, alpha * 3);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.arc(32, -37, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    for (var i = 0; i < cats.length; i++) drawCat(cats[i]);
  }
  function tick(now) {
    var dt = last ? Math.min(0.05, (now - last) / 1000) : 0;
    last = now;
    if (++frame % 60 === 0) readTheme();
    for (var i = 0; i < cats.length; i++) {
      var c = cats[i];
      c.x += c.dir * c.speed * dt;
      c.phase += dt * c.speed / 7;
      c.tail += dt * 2.2;
      if ((c.dir > 0 && c.x > W + 100 * c.s) || (c.dir < 0 && c.x < -100 * c.s)) spawn(c, false);
    }
    draw();
    requestAnimationFrame(tick);
  }

  readTheme(); resize(); makeCats();
  window.addEventListener('resize', function () { resize(); makeCats(); if (reduce) draw(); });
  if (reduce) { draw(); return; }
  requestAnimationFrame(tick);
})();
</script>

</body>
